name: Bug Report
description: Report a bug or unexpected behavior in ClipFlow Pro
title: "[BUG] "
labels: ["bug"]
assignees:
  - nickotmazgin
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste private clipboard contents, passwords, or secrets** — redact anything sensitive from history entries and logs.
        Security issues → use [Security advisories](https://github.com/nickotmazgin/clipflow-pro/security/advisories/new).
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: Clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClipFlow Pro version
      description: Shown in Settings → About, or `gnome-extensions info clipflow-pro@nickotmazgin.github.io`
      placeholder: e.g. 1.5.7
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`
      placeholder: e.g. 46.0
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      description: Output of `echo $XDG_SESSION_TYPE`
      options:
        - X11 / Xorg
        - Wayland
        - Not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distribution
      placeholder: e.g. Zorin OS 18.1, Ubuntu 24.04, Fedora 41
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - GitHub Releases ZIP (gnome-extensions install)
        - Local build (./install.sh or make install)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from `journalctl --user -b -o cat | grep -i clipflow` (redact clipboard text).
        Optionally enable Settings → debug logging first.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / additional context
