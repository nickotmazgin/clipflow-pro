name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run ESLint
        run: |
          npx -y eslint@9 \
            extension.js \
            extension-esm.js \
            prefs-es6.js \
            tools/history-window/clipboardInsert.js \
            tools/history-window/clipboard-read-runner.js \
            tools/history-window/clipboard-set-runner.js \
            tools/history-window/insert-runner.js \
            eslint.config.cjs
